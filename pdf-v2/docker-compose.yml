services:
  db:
    image: postgres:16-alpine
    container_name: sofia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sofia_tools}
      POSTGRES_USER: ${POSTGRES_USER:-sofia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofia}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sofia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  backend:
    build: ./backend
    container_name: sofia-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sofia}:${POSTGRES_PASSWORD:-sofia-secret}@db:5432/${POSTGRES_DB:-sofia_tools}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    container_name: sofia-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sofia}:${POSTGRES_PASSWORD:-sofia-secret}@db:5432/${POSTGRES_DB:-sofia_tools}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis
      - backend
    command: python -m app.workers.runner

  frontend:
    build: ./frontend
    container_name: sofia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
